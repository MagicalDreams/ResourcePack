name: Build resource packs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: versions
        run: |
          echo "generic=$(<GENERIC_VERSION)" >> "$GITHUB_OUTPUT"
          echo "parks=$(<PARKS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Bundle packs
        run: |
          mkdir dist
          (cd "Generic RP" && zip -r "../dist/MagicalDreams-Generic-Pack-v${{ steps.versions.outputs.generic }}.zip" . -x '*.DS_Store')
          (cd "Parks RP" && zip -r "../dist/MagicalDreams-Parks-Pack-v${{ steps.versions.outputs.parks }}.zip" . -x '*.DS_Store')

      - name: Upload Generic pack
        uses: actions/upload-artifact@v7
        with:
          path: dist/MagicalDreams-Generic-Pack-v${{ steps.versions.outputs.generic }}.zip
          archive: false

      - name: Upload Parks pack
        uses: actions/upload-artifact@v7
        with:
          path: dist/MagicalDreams-Parks-Pack-v${{ steps.versions.outputs.parks }}.zip
          archive: false
